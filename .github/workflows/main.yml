name: Publish employee-fe docker image

on:
  push:
    branches:
      - main

jobs:
  push_to_registry:
    name: Push employee-fe docker image to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v5

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image
        run: docker build -t gilbertsitumorang30/employee-fe:1.0.1 .

      - name: Push image
        run: docker push gilbertsitumorang30/employee-fe:1.0.1
